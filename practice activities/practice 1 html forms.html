<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>HTML Forms</h1>
    <form>
        <label for="Firstname">First Name:</label>
        <input type="text" id="Firstname" name="Firstname" placeholder="Enter your first name">
        <br>
        <br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}" placeholder="0912-345-6789">
        <br>
        <br>
        <label for="colors"> Colors:</label>
        <select id="colors">
            <option value="pink">Pink</option>
            <option value="peach">Peach</option>
            <option value="periwinkle">Periwinkle</option>
            <option value="purple">Purple</option>
        </select>
        <br>
        <br>
        <label for="pk-opts"> Choose a Pokemon:</label>
        <input type="text" list="pk-opts" name="pk-choice" id="pk-choice">
        <datalist id="pk-opts">
            <option value="Pikachu">
            <option value="Jigglypuff">
            <option value="Squirtle">
            <option value="Psyduck">
        </datalist>
        
        <br>
        <br>
        <button type="submit">Submit</button>
        <br>
        <br>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
